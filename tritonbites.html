<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triton Bites</title>
<meta name="theme-color" content="#16111a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Pacifico&family=Fredoka:wght@500;600&family=Shrikhand&family=Righteous&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bgfull,var(--bg));background-attachment:fixed;color:var(--tx);font-family:var(--bfont);font-size:15px;line-height:1.45;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--acc-bg)}
h1,h2,h3{margin:0;font-family:var(--hfont);font-weight:700}
h3{font-family:var(--h3font);font-size:16px}
.sub{color:var(--mut);font-size:13px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:30;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;height:58px}
.hd h1{font-size:21px;flex:1}
.logo{font-size:26px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--s1);font-size:17px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;align-items:flex-end;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:140px;padding:9px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--mut)}
nav button span{font-size:19px;line-height:1}
nav button.on{color:var(--acc);font-weight:600}
nav .add{position:relative;top:-14px}
nav .add span{width:54px;height:54px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.35);border:3px solid var(--bg)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-weight:600;transition:transform .12s}
.btn:active,.pill:active,.chip:active{transform:scale(.95)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}
.btn.full{width:100%}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--s2);transition:transform .1s}
.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.g-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty .e{font-size:40px;margin-bottom:6px}
/* progress */
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;flex:0 0 auto}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--nfont);font-size:22px}
.hero-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;flex:1}
.tile{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.tile b{display:block;font-family:var(--nfont);font-size:19px;line-height:1.1}.tile span{font-size:11.5px;color:var(--mut)}
/* map */
.map-wrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.map-wrap svg{display:block;width:100%;height:auto}
.hall-pin{cursor:pointer}
.hall-pin:hover .pin-bg,.hall-pin:focus .pin-bg{stroke-width:3}
.map-note{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--mut);background:var(--s1);padding:2px 7px;border-radius:10px;opacity:.85}
.halls{display:grid;gap:8px}
.hall-row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:left;width:100%}
.hall-row .he{font-size:24px;width:30px;text-align:center}
.hall-row .hn{flex:1;min-width:0}.hall-row b{display:block}
.bar{height:7px;border-radius:5px;background:var(--s2);overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--up);border-radius:5px;transition:width .4s}
.hall-row .hp{font-family:var(--nfont);font-weight:700;font-size:14px;text-align:right}
/* food cards */
.foods{display:grid;gap:8px}
.food{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left;width:100%}
.food .ph{width:56px;height:56px;border-radius:12px;flex:0 0 56px;background:var(--s2);display:grid;place-items:center;font-size:26px;overflow:hidden;border:1px solid var(--line)}
.food .ph img{width:100%;height:100%;object-fit:cover}
.food .fi{flex:1;min-width:0}
.food .fn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.food .fl{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scores{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.sc{font-size:11.5px;padding:2px 7px;border-radius:8px;font-weight:700;font-family:var(--nfont)}
.food .big{font-family:var(--nfont);font-size:24px;font-weight:700;min-width:42px;text-align:center}
.food .big small{display:block;font-size:10px;color:var(--mut);font-weight:500;font-family:var(--bfont)}
.again{font-size:16px}
.tagl{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.tagl span{font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.filters{display:grid;gap:8px;margin:12px 0}
.frow{display:flex;gap:8px;flex-wrap:wrap}.frow select{flex:1 1 120px;width:auto}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.x{width:34px;height:34px;border-radius:50%;background:var(--s2);border:1px solid var(--line);flex:0 0 34px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--s2);font-weight:600;font-size:14px;transition:transform .1s}
.pill.on{border-color:var(--acc);background:var(--acc-bg);color:var(--tx)}
.score-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.score-row button{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--s2);font-weight:700;font-family:var(--nfont);font-size:14px}
.score-row button.on{color:#1b1b1b;border-color:transparent}
.score-lbl{display:flex;justify-content:space-between;align-items:baseline}
.score-lbl b{font-family:var(--nfont);font-size:20px}
.again-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.again-row button{padding:12px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--s2);font-weight:700;display:grid;gap:2px;justify-items:center}
.again-row button span{font-size:22px}
.again-row button.on.yes{border-color:var(--up);background:var(--up-bg)}.again-row button.on.maybe{border-color:var(--full);background:var(--full-bg)}.again-row button.on.no{border-color:var(--bad);background:rgba(255,100,100,.12)}
.status{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.status button{padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--s2);font-weight:700}
.status button.on{border-color:var(--acc);background:var(--acc-bg)}
.photo-box{display:flex;gap:10px;align-items:center}
.photo-box img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.detail-img{width:100%;max-height:300px;object-fit:cover;border-radius:16px;margin-bottom:12px}
.dscores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.dscores div{border-radius:14px;padding:10px;text-align:center}
.dscores b{display:block;font-family:var(--nfont);font-size:28px;line-height:1.1}.dscores span{font-size:11.5px}
.note{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;font-size:14px}
.st-list{display:grid;gap:6px}
.st{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.st .ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;border:1.5px solid var(--line);flex:0 0 24px}
.st .ck.on{background:var(--up);border-color:var(--up);color:var(--on-pri)}
.st .sn{flex:1;min-width:0}.st .sn b{display:block;font-size:14px}
/* stats */
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .rn{font-family:var(--nfont);font-weight:700;width:26px;text-align:center;color:var(--mut)}
.rank .rn.m1{color:#e9b949}.rank .rn.m2{color:#b8c0cc}.rank .rn.m3{color:#d39a6a}
.rank .ri{flex:1;min-width:0}.rank .ri b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.hist{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;align-items:end;height:120px;margin-top:8px}
.hist div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.hist i{display:block;width:100%;border-radius:6px 6px 2px 2px;min-height:2px}
.hist span{font-size:11px;color:var(--mut);font-family:var(--nfont)}.hist small{font-size:10.5px;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.badge{border-radius:14px;padding:10px 6px;text-align:center;background:var(--s2);border:1px solid var(--line);display:grid;gap:2px;justify-items:center}
.badge .be{font-size:28px}.badge b{font-size:12px}.badge span{font-size:10.5px;color:var(--mut)}
.badge.off{opacity:.38;filter:grayscale(1)}
.again-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin-top:6px}
/* picker */
.pick{text-align:center;padding:18px 10px;border-radius:18px;background:linear-gradient(160deg,var(--acc-bg),var(--s2));border:1px solid var(--line);margin-top:12px}
.pick .pe{font-size:46px;animation:pop .4s}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}70%{transform:scale(1.15)}}
.pick h2{font-size:24px;margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--full);color:#1b1b1b;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.theme-opt{padding:10px;border-radius:14px;border:2px solid var(--line);text-align:left;display:grid;gap:6px}
.theme-opt .sw{display:flex;gap:4px}.theme-opt .sw i{width:14px;height:14px;border-radius:50%}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-style:normal;font-size:20px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
/* v2 */
.rh{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.rh-dots{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:6px 0}
.rh-dots span{width:30px;height:30px;border-radius:50%;border:2px solid;display:grid;place-items:center;font-family:var(--nfont);font-weight:700;font-size:13px}
.rh-ln{width:14px;height:2px;background:var(--line)}
.heat-lg{display:flex;align-items:center;gap:8px;font-size:12px;margin:8px 0 0;flex-wrap:wrap}.heat-lg i{width:140px;height:9px;border-radius:5px;display:inline-block}
.hn-note{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-btns{display:flex;gap:8px;margin:14px 0 12px}.stat-btns .btn{flex:1}
.passport{background:linear-gradient(180deg,var(--s1),color-mix(in srgb,var(--s1) 85%,#d9b46a))}
.pp-hall{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(127,127,127,.07) 23px 24px)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;justify-items:center}
.stamp{width:92px;height:92px;border-radius:50%;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--dim);gap:1px}
.stamp b{font-size:10.5px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em;max-width:76px}.stamp small{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}.stamp .se{font-size:20px}
.stamp.on{border:3px double var(--ink);color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--ink) 18%,transparent);animation:stampIn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:scale(1.4) rotate(0);opacity:0}}
.wr{position:fixed;inset:0;z-index:80;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 26px 40px;transition:background .4s}
.wr-bars{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:56px;display:flex;gap:4px}.wr-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}.wr-bars i.done,.wr-bars i.cur{background:#fff}
.wr-x{position:absolute;top:calc(6px + env(safe-area-inset-top));right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;z-index:3}
.wr-tap{position:absolute;top:50px;bottom:0;z-index:1}.wr-tap.l{left:0;width:30%}.wr-tap.r{right:0;width:70%}
.wr-slide{position:relative;z-index:2;max-width:420px;display:grid;gap:8px;justify-items:center;pointer-events:none;animation:wrIn .45s cubic-bezier(.2,.9,.3,1.1)}
.wr-slide button,.wr-slide .seg{pointer-events:auto}
@keyframes wrIn{from{opacity:0;transform:translateY(24px) scale(.97)}}
.wr h1{font-size:34px;line-height:1.1;color:#fff}.wr h2{font-size:22px;color:#fff}
.wr-k{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:700;opacity:.8}
.wr-big{font-size:72px;line-height:1.1}.wr-num{font-family:var(--nfont);font-size:110px;font-weight:700;line-height:1}
.wr-sub{font-size:16px;opacity:.88}.wr-score{font-family:var(--nfont);font-size:56px;font-weight:700}.wr-score small{font-size:20px;opacity:.7}
.wr-img{width:170px;height:170px;object-fit:cover;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.wr-ring{position:relative}.wr-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--nfont);font-size:30px}
.wr-list{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:8px;width:100%;counter-reset:w;text-align:left}
.wr-list li{display:grid;column-gap:10px;grid-template-columns:22px 1fr auto;grid-template-rows:auto auto;align-items:center;background:rgba(255,255,255,.12);border-radius:14px;padding:9px 12px;counter-increment:w}
.wr-list li::before{content:counter(w);grid-row:1/3;font-family:var(--nfont);font-weight:700;font-size:20px;opacity:.8}
.wr-list b{font-size:15px}.wr-list span{grid-column:2;font-size:12px;opacity:.75}.wr-list em{grid-row:1/3;grid-column:3;font-style:normal;font-family:var(--nfont);font-weight:700;font-size:20px}
.wr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.wr-grid div{background:rgba(255,255,255,.12);border-radius:16px;padding:14px 8px;display:grid}.wr-grid b{font-family:var(--nfont);font-size:34px}.wr-grid span{font-size:12.5px;opacity:.85}
.wr-seg{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25)}.wr-seg button{color:rgba(255,255,255,.75)}.wr-seg button.on{background:#fff;color:#2a1636}
.wr-btns{display:flex;gap:10px;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap hd"><span class="logo">🔱</span><h1>Triton Bites</h1><button class="icon-btn" data-act="picker" aria-label="What should I eat?">🎲</button><button class="icon-btn" data-act="settings" aria-label="Settings">⚙️</button></div></header>
<main class="wrap" id="app"></main>
<nav id="nav"></nav>
<div id="modal"></div>

matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if((S.profile.mode||'auto')==='auto'){applyTheme();render()}});
/* ---------- derived ---------- */
const tried=()=>S.foods.filter(f=>f.status==='tried');
const wants=()=>S.foods.filter(f=>f.status==='want');
const stKey=(h,s)=>h+'|'+s;
function triedStations(){return new Set(tried().map(f=>stKey(f.hall,f.station)))}
function hallProg(h){const ts=triedStations();const n=h.stations.filter(s=>ts.has(stKey(h.id,s))).length;return {n,of:h.stations.length,pct:n/h.stations.length}}
function scoreColor(v){if(v==null)return V.s3;const t=(v-1)/9;return t<.5?mix('#e8735f','#f1c75b',t*2):mix('#f1c75b','#7cc66e',(t-.5)*2)}
const scoreLbl=v=>v==null?'Not rated':v<=2?'🤢 Nope':v<=4?'😕 Meh':v<=6?'🙂 Fine':v<=8?'😋 Good':'🤩 Amazing';
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
function ratesOf(f){if(Array.isArray(f.rates)&&f.rates.length)return f.rates;if(f.overall!=null)return [{o:f.overall,q:f.quality,y:f.yum}];return []}
function aggr(rs){const a=k=>{const v=rs.map(r=>r[k]).filter(x=>x!=null);return v.length?Math.round(avg(v)*10)/10:null};return {overall:a('o'),quality:a('q'),yum:a('y')}}
function trendOf(f){const r=ratesOf(f);if(r.length<2)return null;return r[r.length-1].o-r[r.length-2].o}
const trendIcon=d=>d==null?'':d>0?'<span title="Better than last time" style="color:var(--up)">↗</span>':d<0?'<span title="Worse than last time" style="color:var(--bad)">↘</span>':'<span title="Same as last time" style="color:var(--mut)">→</span>';
function hallAvg(id){return avg(tried().filter(f=>f.hall===id&&f.overall!=null).map(f=>f.overall))}
const fmt1=v=>v==null?'—':(Math.round(v*10)/10).toString();
function ringSVG(p,size,stroke,color,track){const r=(size-stroke)/2,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track||V.s3}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color||V.up}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
/* ---------- views: map ---------- */
function mapSVG(){const ts=triedStations();const sea=curMode()==='light'?'#bfe1ef':'#173a4d',sea2=curMode()==='light'?'#a6d4e8':'#1d4a60',sand=curMode()==='light'?'#f3e3c0':'#4a4030',land=curMode()==='light'?mix(V.bg,'#cfe3b8',.45):mix(V.bg,'#3b4a33',.55),grove=curMode()==='light'?'#a9cf8f':'#3f5c37',road=curMode()==='light'?'#ffffff':mix(V.bg,'#ffffff',.18),txt=V.mut;

  <g fill="none" stroke="${road}" stroke-width="7" stroke-linecap="round" opacity=".9"><path d="M74 0 C64 90 80 160 66 240 C56 320 76 400 64 520"/><path d="M340 500 C300 470 250 470 214 440 C180 410 175 360 180 300 C186 250 230 230 250 170 C262 130 300 90 350 70"/><path d="M190 60 C200 140 196 240 200 320"/></g>
  <g fill="none" stroke="${mix(road,V.tx,.25)}" stroke-width="1" stroke-dasharray="3 4" opacity=".6"><path d="M74 0 C64 90 80 160 66 240 C56 320 76 400 64 520"/><path d="M340 500 C300 470 250 470 214 440 C180 410 175 360 180 300 C186 250 230 230 250 170 C262 130 300 90 350 70"/></g>
  <text x="82" y="508" fill="${txt}" font-size="8.5" font-style="italic">N Torrey Pines Rd</text><text x="282" y="472" fill="${txt}" font-size="8.5" font-style="italic" transform="rotate(-24 282 472)">Gilman Dr</text>
  <g><polygon points="186,128 200,114 214,128 207,142 193,142" fill="${mix(V.s3,V.tx,.2)}" stroke="${V.line}"/><rect x="194" y="142" width="12" height="7" fill="${mix(V.s3,V.tx,.2)}"/><text x="200" y="160" fill="${txt}" font-size="8.5" text-anchor="middle" font-weight="600">Geisel</text></g>
  <g><rect x="190" y="292" width="30" height="16" rx="4" fill="${mix(V.s3,V.tx,.15)}" stroke="${V.line}"/><text x="205" y="320" fill="${txt}" font-size="8.5" text-anchor="middle" font-weight="600">Price Center</text></g>
  <g><rect x="262" y="104" width="26" height="14" rx="4" fill="${mix(V.s3,V.tx,.15)}" stroke="${V.line}"/><text x="275" y="130" fill="${txt}" font-size="8.5" text-anchor="middle" font-weight="600">RIMAC</text></g>
  <g transform="translate(330,30)"><circle r="13" fill="${V.s1}" stroke="${V.line}"/><path d="M0 -9 L4 3 L0 0 L-4 3Z" fill="${V.lo}"/><text y="10" fill="${txt}" font-size="7" text-anchor="middle" font-weight="700">N</text></g>`;
  const heat=S.mapMode==='rate';
  for(const hl of HALLS){const p=hallProg(hl),done=p.n===p.of&&!heat,ha=hallAvg(hl.id),hc=ha!=null?scoreColor(ha):V.s3,r=21,c=2*Math.PI*(r+4);const below=hl.lp==="b";
    h+=`<g class="hall-pin" data-act="hall" data-v="${hl.id}" tabindex="0" role="button" aria-label="${esc(hl.name)}: ${p.n} of ${p.of} stations tried">
      <circle cx="${hl.x}" cy="${hl.y}" r="${r+4}" fill="none" stroke="${V.s3}" stroke-width="4.5"/>
      <circle cx="${hl.x}" cy="${hl.y}" r="${r+4}" fill="none" stroke="${heat?hc:done?'#e9b949':V.up}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${heat?(ha!=null?0:c):c*(1-p.pct)}" transform="rotate(-90 ${hl.x} ${hl.y})"/>
      <circle class="pin-bg" cx="${hl.x}" cy="${hl.y}" r="${r}" fill="${heat?(ha!=null?mix(V.s1,hc,.35):mix(V.s1,V.bg,.4)):p.n?V.s1:mix(V.s1,V.bg,.4)}" stroke="${heat?(ha!=null?hc:V.line):p.n?V.up:V.line}" stroke-width="1.5"/>
      <text x="${hl.x}" y="${hl.y+1}" font-size="20" text-anchor="middle" dominant-baseline="central" ${p.n?'':'opacity=".55"'}>${hl.e}</text>
      ${done?`<text x="${hl.x+18}" y="${hl.y-18}" font-size="13" text-anchor="middle">👑</text>`:''}
      <g transform="translate(${below?hl.x:hl.x+30},${hl.y+(below?38:0)})"><rect x="${below?-42:0}" y="-9" width="84" height="20" rx="10" fill="${V.s1}" stroke="${V.line}" opacity=".95"/><text x="${below?0:42}" y="1" font-size="9.5" text-anchor="middle" dominant-baseline="central" fill="${V.tx}" font-weight="700">${esc(hl.name)} <tspan fill="${heat&&ha!=null?hc:V.mut}" font-weight="700">${heat?(ha!=null?fmt1(ha):'—'):p.n+'/'+p.of}</tspan></text></g>
    </g>`}
  return h+'</svg>'}
function viewMap(){const ts=triedStations(),T=tried(),W=wants();const pct=ts.size/TOTAL_ST;const hallsDone=HALLS.filter(h=>hallProg(h).n===h.stations.length).length;
  let h=`<div class="card" style="margin-top:14px"><div class="hero"><div class="ring">${ringSVG(pct,104,11)}<b>${Math.round(pct*100)}%</b></div>

    ${T.length+W.length?`<div class="sub" style="margin-top:10px">🍽️ Food list: <b>${T.length}</b> of <b>${T.length+W.length}</b> tried (${Math.round(T.length/(T.length+W.length)*100)}%)</div><div class="bar"><i style="width:${T.length/(T.length+W.length)*100}%;background:var(--acc)"></i></div>`:''}</div>`;

  h+=`<div class="g-h" style="margin-top:4px"><div class="seg"><button class="${S.mapMode!=='rate'?'on':''}" data-act="mapMode" data-v="prog">📍 Progress</button><button class="${S.mapMode==='rate'?'on':''}" data-act="mapMode" data-v="rate">🌡️ Ratings</button></div><button class="btn sm" data-act="passport">🛂 Passport</button></div>

    ${S.mapMode==='rate'?`<div class="heat-lg"><span>1</span><i style="background:linear-gradient(90deg,${scoreColor(1)},${scoreColor(5.5)},${scoreColor(10)})"></i><span>10</span><span class="sub">· your average overall per hall · gray = nothing rated</span></div>`:''}
    <h3 style="margin:16px 0 8px">Dining halls</h3><div class="halls">${HALLS.map(hl=>{const p=hallProg(hl),fs=T.filter(f=>f.hall===hl.id),a=avg(fs.map(f=>f.overall).filter(x=>x!=null));

  return h}
/* ---------- hall sheet ---------- */
function viewHall(id){const hl=HMAP[id],ts=triedStations(),p=hallProg(hl);
  const st=hl.stations.map(s=>{const fs=S.foods.filter(f=>f.hall===id&&f.station===s),T=fs.filter(f=>f.status==='tried'),a=avg(T.map(f=>f.overall).filter(x=>x!=null));const best=[...T].sort((x,y)=>(y.overall||0)-(x.overall||0))[0];
    return `<div class="st"><span class="ck ${ts.has(stKey(id,s))?'on':''}">${ts.has(stKey(id,s))?'✓':''}</span><span class="sn"><b>${esc(s)}</b><span class="sub">${T.length?`${T.length} tried${a!=null?` · avg ${fmt1(a)}`:''}${best?` · best: ${esc(best.name)}`:''}`:'Not tried yet'}${fs.length-T.length?` · ${fs.length-T.length} to try`:''}</span></span><button class="btn sm" data-act="addAt" data-h="${id}" data-s="${esc(s)}" aria-label="Add food at ${esc(s)}">＋</button></div>`}).join('');
  const foods=S.foods.filter(f=>f.hall===id).sort((a,b)=>(a.status===b.status?0:a.status==='tried'?-1:1)||(b.overall||0)-(a.overall||0));
  return `<div class="ov" data-act="close"><div class="sheet" data-stop><div class="sh-h"><div><h2>${hl.e} ${esc(hl.name)}</h2><div class="sub">${esc(hl.college)} · ${p.n}/${p.of} stations tried</div></div><button class="x" data-act="close" aria-label="Close">✕</button></div>
    <div class="bar" style="margin-bottom:14px"><i style="width:${p.pct*100}%"></i></div>
    <div class="field"><label for="hallNote">🕐 Hours & notes</label><textarea id="hallNote" data-h="${id}" rows="2" placeholder="e.g. Closes 2pm weekdays · Taqueria line is shortest around 3" maxlength="300">${esc((S.profile.hallNotes||{})[id]||'')}</textarea><div class="sub">Just for you. Official hours: <a href="https://hdhdining.ucsd.edu" target="_blank" rel="noopener" style="color:var(--acc)">hdhdining.ucsd.edu</a></div></div>
    <div class="flabel" style="margin-bottom:6px">Stations</div><div class="st-list">${st}</div>
    <div class="g-h" style="margin-top:16px"><span class="flabel">Foods here</span><button class="btn sm" data-act="pickHere" data-v="${id}">🎲 Pick for me</button></div>

/* ---------- food card / detail ---------- */
function stationEmoji(f){return HMAP[f.hall]?.e||'🍽️'}

  return `<button class="food" data-act="food" data-v="${f.id}"><span class="ph">${f.photo?`<img src="${f.photo}" alt="" loading="lazy">`:stationEmoji(f)}</span><span class="fi"><div class="fn">${esc(f.name)}</div><div class="fl">${esc(hl?hl.name:'')} · ${esc(f.station)}</div>
    ${t?`<div class="scores">${[['Q',f.quality],['Y',f.yum]].filter(x=>x[1]!=null).map(([k,v])=>`<span class="sc" style="background:${rgba(scoreColor(v),.25)};color:${V.tx}">${k==='Q'?'Quality':'Yum'} ${fmt1(v)}</span>`).join('')}${f.again?`<span class="again" title="${AGAIN[f.again][1]}">${AGAIN[f.again][0]}</span>`:''}${f.portion?`<span class="again" title="${PORTION[f.portion][1]} portion">${PORTION[f.portion][0]}</span>`:''}${ratesOf(f).length>1?`<span class="sc" style="background:var(--s2);color:var(--mut)">×${ratesOf(f).length} ${trendIcon(trendOf(f))}</span>`:''}</div>`:`<div class="scores"><span class="sc" style="background:var(--acc-bg);color:var(--acc)">⭐ Want to try</span></div>`}

function rateHistory(f){const r=ratesOf(f),d=trendOf(f);return `<div class="rh"><div class="g-h" style="margin-bottom:4px"><span class="flabel">Your ratings (${r.length})</span><span class="sub">${d>0?'↗ Getting better':d<0?'↘ Slipping':'→ Consistent'}</span></div>

/* ---------- form ---------- */
function blankForm(o){return {id:null,hall:'',station:'',name:'',status:'tried',overall:null,quality:null,yum:null,again:null,portion:null,tags:[],notes:'',photo:null,...o}}

    ${F.status==='tried'?`${scoreField('overall','Overall','Your total verdict.')}${scoreField('quality','Quality','Freshness, cooked right, good ingredients.')}${scoreField('yum','Yumminess','Pure taste. Did it slap?')}

  const sc={};for(const f of T){const k=stKey(f.hall,f.station);sc[k]=(sc[k]||0)+ratesOf(f).length}const favS=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  const aO=avg(rated.map(f=>f.overall)),again=T.filter(f=>f.again==='yes').length;
  const tagC={};for(const f of T)for(const t of f.tags||[])tagC[t]=(tagC[t]||0)+1;const topTag=(Object.entries(tagC).sort((a,b)=>b[1]-a[1])[0]||[])[0]||'';
  let pers;if(triedStations().size>=TOTAL_ST*.6)pers=['🧭','The Explorer','No station is safe from you. You\'ve eaten your way across campus.'];
  else if(aO!=null&&aO>=8.2)pers=['📣','The Hype Machine','You find the joy in every tray. Dining hall food has never had a bigger fan.'];
  else if(aO!=null&&aO<=5.5)pers=['🧐','The Tough Critic','A 7 from you is basically a Michelin star.'];
  else if(/Spicy/.test(topTag))pers=['🌶️','Spice Seeker','If it doesn\'t make you sweat, what\'s the point?'];
  else if(/Sweet|Dessert/.test(topTag))pers=['🍰','Sweet Tooth','Dessert is a food group and you\'re living proof.'];
  else if(/Vegan|Vegetarian/.test(topTag))pers=['🌱','Plant Powered','Veggies, but make them delicious.'];
  else if(/Healthy/.test(topTag))pers=['🥗','Wellness Warrior','Fueling up like a pro.'];
  else if(/Comfort/.test(topTag))pers=['🛋️','Comfort Connoisseur','Warm, cozy, carby. You know what you like.'];
  else if(/Late night/.test(topTag))pers=['🌙','Night Owl','The best bites happen after 9pm.'];
  else if(favH&&favH[1]>=T.length*.5&&T.length>=4)pers=['🏠','The Loyal Regular',`${HMAP[favH[0]].name} is basically your kitchen.`];
  else pers=['⚖️','The Balanced Foodie','A little of everything, a lot of good taste.'];
  return {label,T,rated,sts,hallsSet,top,favH,favS,aO,again,pers,period}}
function wrapSlides(D){const sl=[];
  sl.push(`<div class="wr-big">🔱</div><div class="wr-k">Triton Bites Wrapped</div><h1>${esc(D.label)}</h1><div class="seg wr-seg"><button class="${D.period==='q'?'on':''}" data-act="wrPeriod" data-v="q">This quarter</button><button class="${D.period==='all'?'on':''}" data-act="wrPeriod" data-v="all">All time</button></div><div class="wr-sub">${D.T.length?'Tap to start →':'No foods tried in this period yet. Try "All time"!'}</div>`);
  if(!D.T.length)return sl;
  sl.push(`<div class="wr-k">You tried</div><div class="wr-num">${D.T.length}</div><h2>food${D.T.length!==1?'s':''}</h2><div class="wr-sub">at ${D.sts.size} station${D.sts.size!==1?'s':''} across ${D.hallsSet.size} dining hall${D.hallsSet.size!==1?'s':''}</div>`);
  sl.push(`<div class="wr-k">Passport progress</div><div class="wr-ring">${ringSVG(triedStations().size/TOTAL_ST,150,14,'#ffffff','rgba(255,255,255,.2)')}<b>${triedStations().size}/${TOTAL_ST}</b></div><div class="wr-sub">${D.sts.size} stamp${D.sts.size!==1?'s':''} ${D.period==='q'?'earned this quarter':'collected'}${HALLS.filter(h=>hallProg(h).n===h.stations.length).length?` · ${HALLS.filter(h=>hallProg(h).n===h.stations.length).length} hall${HALLS.filter(h=>hallProg(h).n===h.stations.length).length>1?'s':''} complete 👑`:''}</div>`);
  if(D.top[0]){const f=D.top[0];sl.push(`<div class="wr-k">Your #1 food</div><div class="wr-big">${f.photo?`<img class="wr-img" src="${f.photo}" alt="">`:HMAP[f.hall].e}</div><h1>${esc(f.name)}</h1><div class="wr-sub">${esc(HMAP[f.hall].name)} · ${esc(f.station)}</div><div class="wr-score">${fmt1(f.overall)}<small>/10</small></div>`)}
  if(D.favH){const h=HMAP[D.favH[0]];const a=avg(D.rated.filter(f=>f.hall===h.id).map(f=>f.overall));sl.push(`<div class="wr-k">Your dining hall</div><div class="wr-big">${h.e}</div><h1>${esc(h.name)}</h1><div class="wr-sub">${D.favH[1]} food${D.favH[1]!==1?'s':''} tried${a!=null?` · avg ${fmt1(a)}`:''}</div>${D.favS?`<div class="wr-sub" style="margin-top:10px">Most-rated station: <b>${esc(D.favS[0].split('|')[1])}</b></div>`:''}`)}
  if(D.top.length>1)sl.push(`<div class="wr-k">Your top ${D.top.length}</div><ol class="wr-list">${D.top.map(f=>`<li><b>${esc(f.name)}</b><span>${esc(HMAP[f.hall].name)}</span><em>${fmt1(f.overall)}</em></li>`).join('')}</ol>`);
  sl.push(`<div class="wr-k">Your taste personality</div><div class="wr-big">${D.pers[0]}</div><h1>${D.pers[1]}</h1><div class="wr-sub">${esc(D.pers[2])}</div>`);
  sl.push(`<div class="wr-k">By the numbers</div><div class="wr-grid"><div><b>${fmt1(D.aO)}</b><span>avg overall</span></div><div><b>${D.again}</b><span>would get again 👍</span></div><div><b>${D.T.reduce((a,f)=>a+ratesOf(f).length,0)}</b><span>ratings given</span></div><div><b>${D.T.filter(f=>f.photo).length}</b><span>food photos</span></div></div>`);
  sl.push(`<div class="wr-big">🌊</div><h1>Here's to more bites!</h1><div class="wr-sub">${triedStations().size<TOTAL_ST?`${TOTAL_ST-triedStations().size} stations left to stamp.`:'Every station stamped. Legend. 👑'}</div><div class="wr-btns"><button class="btn" data-act="wrShare">📤 Share</button><button class="btn pri" data-act="wrClose">Done</button></div>`);
  return sl}
const WR_BG=[['#3a1c4a','#a3416f'],['#173a4d','#3f8f8a'],['#24351f','#7aa34a'],['#4a2a14','#d0803a'],['#2b1f4f','#7a5cc4'],['#4a1830','#e0708f'],['#1d2f4a','#5fa0d0'],['#3a3014','#c9a24a'],['#2a1636','#c766b6']];
function openWrapped(){const D=wrapData(S.wr.period);const sl=wrapSlides(D);const i=Math.min(S.wr.i,sl.length-1);S.wr.i=i;S.wr.n=sl.length;S.wr.D=D;const bg=WR_BG[i%WR_BG.length];
  let el=$('#wr');if(!el){el=document.createElement('div');el.id='wr';document.body.appendChild(el);document.body.style.overflow='hidden'}
  el.className='wr';el.style.background=`radial-gradient(circle at 20% 15%,${bg[1]},transparent 60%),radial-gradient(circle at 85% 90%,${bg[1]}99,transparent 55%),${bg[0]}`;
  el.innerHTML=`<div class="wr-bars">${sl.map((_,j)=>`<i class="${j<i?'done':j===i?'cur':''}"></i>`).join('')}</div><button class="wr-x" data-act="wrClose" aria-label="Close">✕</button>
    <div class="wr-tap l" data-act="wrPrev"></div><div class="wr-tap r" data-act="wrNext"></div><div class="wr-slide" key="${i}">${sl[i]}</div>`}
function closeWrapped(){$('#wr')?.remove();document.body.style.overflow=''}
/* ---------- settings ---------- */
function viewSettings(){const p=S.profile;return `<div class="ov" data-act="close"><div class="sheet" data-stop><div class="sh-h"><h2>Settings</h2><button class="x" data-act="close">✕</button></div>
  <h3 style="margin-bottom:8px">🎨 Theme</h3><div class="themes">${Object.entries(THEMES).map(([k,t])=>{const v=themeVars(k);return `<button class="theme-opt" data-act="theme" data-v="${k}" style="background:${v.bgfull};color:${v.tx};border-color:${p.theme===k?v.acc:v.line}"><b style="font-family:${v.hfont.replace(/"/g,"'")}">${esc(t.name)}</b><span class="sw">${[v.lo,v.up,v.full,v.ca,v.rest].map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`}).join('')}</div>
  <div class="set-row"><b>Mode</b><div class="seg">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([v,l])=>`<button class="${(p.mode||'auto')===v?'on':''}" data-act="mode" data-v="${v}">${l}</button>`).join('')}</div></div>
  <div class="set-row"><div><b>💾 Backup</b><div class="sub">${Store.mode==='cloud'?'Saved to your Claude account.':'Saved on this device only.'} ${S.foods.length} foods.</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="exportFile">Save file</button><button class="btn sm" data-act="exportCopy">Copy</button></div></div>
  <div class="field" style="margin-top:12px"><label for="impTxt">Restore from a backup</label><textarea id="impTxt" placeholder="Paste a backup here (it adds to what's here)"></textarea><button class="btn sm" data-act="importData" style="justify-self:start">Restore</button></div>
  <div class="sub">Triton Bites isn't affiliated with UCSD or HDH. Station lists are from you; edit requests welcome!</div></div></div>`}
function backupJSON(){return JSON.stringify({app:'tritonbites',v:1,foods:Object.fromEntries(S.foods.map(f=>{const {id,...r}=f;return [id,r]})),profile:S.profile})}
async function exportFile(){const txt=backupJSON(),name='triton-bites-backup.json';let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:txt});toast('💾 Backup saved');return}catch(e){if(e&&e.code==='declined')return}}
  if(!(window.claude&&window.claude.use)){try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('💾 Backup saved');return}catch(e){}}
  copyText(txt)}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('📋 Copied! Paste it into a note to keep it safe.')).catch(()=>toast('Couldn\'t copy here'))}catch(e){toast('Couldn\'t copy here')}}
async function importData(){const raw=$('#impTxt')?.value||'';let d;try{d=JSON.parse(raw)}catch(e){toast('That doesn\'t look like a Triton Bites backup');return}if(!d||d.app!=='tritonbites'||!d.foods){toast('That doesn\'t look like a Triton Bites backup');return}
  let n=0;for(const [id,doc] of Object.entries(d.foods)){if(!HMAP[doc.hall])continue;try{await Store.saveFood(id,doc);n++}catch(e){}}closeModal();render();toast(`Restored ${n} food${n!==1?'s':''}`)}
/* ---------- render ---------- */
const TABS=[['map','🗺️','Map'],['list','🍽️','Foods'],['add','＋',''],['stats','🏆','Stats'],['pick','🎲','Pick']];
function render(){$('#nav').innerHTML=TABS.map(([k,e,l])=>k==='add'?`<button class="add" data-act="add" aria-label="Add a food"><span>＋</span></button>`:`<button class="${S.tab===k?'on':''}" data-act="${k==='pick'?'picker':'tab'}" data-v="${k}"><span>${e}</span>${l}</button>`).join('');
  const a=$('#app');if(!S.loaded){a.innerHTML='<div class="empty" style="margin-top:40px"><div class="e">🔱</div>Loading your bites…</div>';return}
  const f=document.activeElement&&document.activeElement.id,ss=f&&document.activeElement.selectionStart;
  a.innerHTML=S.tab==='list'?viewList():S.tab==='stats'?viewStats():viewMap();
  if(f&&$('#'+f)&&a.contains($('#'+f))){const el=$('#'+f);el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}
let modalView=null;
function openModal(fn){modalView=fn;$('#modal').innerHTML=fn();document.body.style.overflow='hidden'}
function refreshModal(){if(!modalView)return;const sh=$('#modal .sheet'),st=sh?sh.scrollTop:0;const f=document.activeElement&&document.activeElement.id,ss=f&&document.activeElement.selectionStart;$('#modal').innerHTML=modalView();const n=$('#modal .sheet');if(n)n.scrollTop=st;if(f&&$('#'+f)){const el=$('#'+f);el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}
function closeModal(){modalView=null;$('#modal').innerHTML='';document.body.style.overflow=''}
function openForm(o){S.form=blankForm(o);openModal(viewForm)}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  if(a==='close'){if(ev.target===t||t.classList.contains('x'))closeModal();return}
  switch(a){
    case 'tab':S.tab=v;render();scrollTo({top:0});break;
    case 'add':openForm({});break;
    case 'addAt':openForm({hall:t.dataset.h,station:t.dataset.s||(HMAP[t.dataset.h].stations.length===1?HMAP[t.dataset.h].stations[0]:'')});setTimeout(()=>$('#fName')?.focus(),50);break;
    case 'hall':openModal(()=>viewHall(v));break;
    case 'food':openModal(()=>viewFood(v));break;
    case 'edit':{const f=S.foods.find(x=>x.id===v);if(f){const r=ratesOf(f),last=r[r.length-1]||{};S.form=blankForm({...clone(f),overall:last.o??null,quality:last.q??null,yum:last.y??null,nRates:r.length});openModal(viewForm)}break}
    case 'rerate':{const f=S.foods.find(x=>x.id===v);if(f){S.form=blankForm({...clone(f),overall:null,quality:null,yum:null,rerate:true});openModal(viewForm)}break}
    case 'fPortion':S.form.portion=S.form.portion===v?null:v;refreshModal();break;
    case 'mapMode':S.mapMode=v;render();break;
    case 'passport':openModal(viewPassport);break;
    case 'wrapped':S.wr={i:0,period:S.wr?.period||'q'};openWrapped();break;
    case 'rateWant':{const f=S.foods.find(x=>x.id===v);if(f){S.form=blankForm({...clone(f),status:'tried',wasWant:true});openModal(viewForm)}break}
    case 'del':{const f=S.foods.find(x=>x.id===v);if(f&&confirm(`Delete "${f.name}"?`)){Store.delFood(v).then(()=>{closeModal();render();toast('Deleted')}).catch(()=>toast('Couldn\'t delete'))}break}
    case 'fHall':S.form.hall=v;S.form.station=HMAP[v].stations.length===1?HMAP[v].stations[0]:'';refreshModal();break;
    case 'fStation':S.form.station=v;refreshModal();setTimeout(()=>$('#fName')?.focus(),30);break;
    case 'fStatus':S.form.status=v;refreshModal();break;
    case 'score':{const k=t.dataset.k,n=+v;S.form[k]=S.form[k]===n?null:n;if(k==='overall'){if(S.form.quality==null)S.form.quality=n;if(S.form.yum==null)S.form.yum=n}refreshModal();break}
    case 'fAgain':S.form.again=S.form.again===v?null:v;refreshModal();break;
    case 'fTag':{const T=S.form.tags;S.form.tags=T.includes(v)?T.filter(x=>x!==v):[...T,v];refreshModal();break}
    case 'fNoPhoto':S.form.photo=null;refreshModal();break;
    case 'saveFood':{if(S.form.wasWant&&S.form.status==='tried'){S.profile.wishDone=(S.profile.wishDone||0)+1;Store.saveProfile()}saveForm();break}
    case 'lStatus':S.list.status=v;S.list.sort=v==='want'?'hall':'overall';render();break;
    case 'tagList':S.tab='list';S.list={...S.list,status:'tried',tag:v};render();scrollTo({top:0});break;
    case 'picker':S.pick.res=null;openModal(viewPicker);break;
    case 'pickHere':S.pick={...S.pick,hall:v,res:null};pickNow();openModal(viewPicker);break;
    case 'pMode':S.pick.mode=v;S.pick.res=null;refreshModal();break;
    case 'reroll':pickNow();refreshModal();break;
    case 'settings':openModal(viewSettings);break;
    case 'theme':S.profile.theme=v;Store.saveProfile();applyTheme();refreshModal();render();break;
    case 'mode':S.profile.mode=v;Store.saveProfile();applyTheme();refreshModal();render();break;
    case 'exportFile':exportFile();break;
    case 'exportCopy':copyText(backupJSON());break;
    case 'importData':importData();break;
    case 'wrNext':if(S.wr.i<S.wr.n-1){S.wr.i++;openWrapped()}break;
    case 'wrPrev':if(S.wr.i>0){S.wr.i--;openWrapped()}break;
    case 'wrClose':closeWrapped();break;
    case 'wrPeriod':S.wr.period=v;S.wr.i=0;openWrapped();break;
    case 'wrShare':{const D=S.wr.D;const txt=`🔱 My Triton Bites Wrapped (${D.label})\n🍽️ ${D.T.length} foods tried at ${D.sts.size} stations\n🛂 ${triedStations().size}/${TOTAL_ST} station stamps${D.top[0]?`\n🥇 #1: ${D.top[0].name} (${HMAP[D.top[0].hall].name}) ${fmt1(D.top[0].overall)}/10`:''}\n${D.pers[0]} ${D.pers[1]}`;if(navigator.share)navigator.share({text:txt}).catch(()=>{});else copyText(txt);break}
  }});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='fName'){S.form.name=t.value;const btn=$('[data-act=saveFood]');const before=!!$('.sugg')||!!document.querySelector('.field .sub b');clearTimeout(t._r);t._r=setTimeout(refreshModal,250);if(btn){btn.disabled=!t.value.trim();btn.style.opacity=t.value.trim()?'':'.5'}}
  else if(t.id==='fNotes')S.form.notes=t.value;
  else if(t.id==='hallNote'){S.profile.hallNotes={...(S.profile.hallNotes||{}),[t.dataset.h]:t.value.slice(0,300)};if(!t.value.trim())delete S.profile.hallNotes[t.dataset.h];Store.saveProfile()}
  else if(t.id==='lq'){S.list.q=t.value;render()}});
document.addEventListener('change',async ev=>{const t=ev.target;
  if(t.id==='lhall'){S.list.hall=t.value;render()}else if(t.id==='ltag'){S.list.tag=t.value;render()}else if(t.id==='lsort'){S.list.sort=t.value;render()}else if(t.id==='lagain'){S.list.again=t.value;render()}
  else if(t.id==='pHall'){S.pick.hall=t.value;S.pick.res=null;refreshModal()}
  else if(t.id==='fPhoto'&&t.files[0]){try{S.form.photo=await compressImg(t.files[0]);refreshModal()}catch(e){toast('Couldn\'t read that photo')}}});
document.addEventListener('keydown',ev=>{if($('#wr')){if(ev.key==='ArrowRight')$('.wr-tap.r')?.click();else if(ev.key==='ArrowLeft')$('.wr-tap.l')?.click();else if(ev.key==='Escape')closeWrapped();return}if(ev.key==='Escape'&&modalView)closeModal();if(ev.key==='Enter'&&(ev.target.classList&&ev.target.classList.contains('hall-pin'))){ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
applyTheme();render();Store.init();
</script>
